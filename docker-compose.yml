services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: smart_welcome
      MYSQL_USER: welcome_user
      MYSQL_PASSWORD: welcome_dev_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: welcome_user
      DB_PASSWORD: welcome_dev_password
      DB_NAME: smart_welcome
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-publishing-1234567890}
      FRONTEND_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/data/uploads
      SEED_DEMO: "true"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  mysql_data:
  uploads:
